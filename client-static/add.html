<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a film - My Film Reviews</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<header>
    <div class="content-width">
        <div class="site-branding">
            My Film Reviews
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="add.html">Add</a>
        </nav>
        </div>
</header>
<main class="content-width">
    <h1>Add a Film</h1>
    <form action="#">
        <div class="form-group">
            <label for="title">Film Title</label>
            <input type="text" id="title" name="title" required minlength="1" maxlength="100">
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="">-- Select a category --</option>
                <option value="animation">Animation</option>
                <option value="action">Action</option>
                <option value="drama">Drama</option>
                <option value="comedy">Comedy</option>
                <option value="horror">Horror</option>
                <option value="sci-fi">Sci-Fi</option>
                <option value="fantasy">Fantasy</option>
            </select>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="6" required minlength="10" maxlength="1000"></textarea>
        </div>
        <div class="form-group">
            <label for="director">Director:</label>
            <input type="text" id="director" name="director" required maxlength="100">
        </div>
        <div class="form-group">
            <label for="release-year">Release Year:</label>
            <input type="number" id="release-year" name="release-year" min="1888" max="2026" required>
        </div>
        <button type="submit">Add Film</button>
    </form>
</main>
<footer>
    <div class="content-width">
        <p>&copy; 2026 My Film Reviews. All rights reserved.</p>
    </div>
</footer>
</body>
</html>
